server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: let Angular handle client-side routes (/cv, /portfolio, ...)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache immutable build assets and media; never cache index.html
    location ~* \.(?:js|css|png|jpe?g|gif|svg|ico|webp|woff2?|mp4|webm|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
}
