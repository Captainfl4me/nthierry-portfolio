<div class="card" (click)="click()">
  <div class="thumb-wrap">
    <div class="thumb" [style.background-image]="'url('+image+')'"></div>
  </div>
  <div class="body">
    <div class="meta">
      <h2>{{ name }}</h2>
      <span class="chip" *ngIf="info">{{ info }}</span>
    </div>
    <p>{{ description }}</p>
    <span class="more">
      Voir le projet
      <img src="/assets/icons/arrow-forward-outline.svg" onload="SVGInject(this)">
    </span>
  </div>
</div>
