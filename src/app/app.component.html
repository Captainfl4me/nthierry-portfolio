<div class="page">
  <header class="navbar">
    <div class="nav-inner">
      <a class="brand" routerLink="/home">
        <ng-container *ngIf="displayTitle">Nicolas Thierry<span class="dot">.</span></ng-container>
      </a>
      <nav>
        <ul>
          <li><a routerLink="/home" routerLinkActive="is-active">Accueil</a></li>
          <li><a routerLink="/portfolio" routerLinkActive="is-active">Projets</a></li>
          <li><a routerLink="/cv" routerLinkActive="is-active">CV</a></li>
        </ul>
        <button class="icon-btn theme-toggle" (click)="toggleTheme()"
          [attr.aria-label]="theme === 'dark' ? 'Passer en thème clair' : 'Passer en thème sombre'"
          [title]="theme === 'dark' ? 'Thème clair' : 'Thème sombre'">
          <!-- moon: shown in light mode -->
          <svg *ngIf="theme === 'light'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          <!-- sun: shown in dark mode -->
          <svg *ngIf="theme === 'dark'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </button>
      </nav>
    </div>
  </header>

  <main>
    <router-outlet></router-outlet>
  </main>

  <footer>
    <div class="footer-inner">
      <span>© {{ year }} Nicolas Thierry — Ingénieur aérospatial</span>
      <div class="socials">
        <button class="icon-btn" (click)="openLink('https://github.com/Captainfl4me')" aria-label="GitHub">
          <img src="/assets/icons/logo-github.svg" onload="SVGInject(this)">
        </button>
        <button class="icon-btn" (click)="openLink('https://www.linkedin.com/in/nicolasthierry')" aria-label="LinkedIn">
          <img src="/assets/icons/logo-linkedin.svg" onload="SVGInject(this)">
        </button>
      </div>
    </div>
  </footer>
</div>
